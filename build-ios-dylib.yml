name: Build iOS dylib

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build arm64 dylib
        run: |
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -dynamiclib \
            -fobjc-arc \
            -framework Foundation \
            -install_name @rpath/bypassEnti.dylib \
            bypassEnti.m \
            -o bypassEnti.dylib

          file bypassEnti.dylib
          xcrun --sdk iphoneos otool -hv bypassEnti.dylib

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: bypassEnti-ios-arm64
          path: bypassEnti.dylib
          if-no-files-found: error
          retention-days: 14
